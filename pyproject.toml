[project]
name = "crusoe-foundry-demo"
version = "0.1.0"
description = "Fine-tune, deploy and evaluate a model on Crusoe Intelligence Foundry, from one Python file"
readme = "README.md"
license = "MIT"
authors = [{ name = "Julien Simon" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/juliensimon/crusoe-demo"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test_demo.py"]
